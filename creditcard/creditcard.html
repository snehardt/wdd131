<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Form</title>
    <link rel="icon" href="favicon2.png">
    <link rel="stylesheet" href="creditcard.css"/>
    <script src="creditcard.js" defer></script>
</head>
<body>
    <form class="card" id="creditCardForm" novalidate>
        <section class="cardFront" role="region" aria-labelledby="creditCardFront">
            <div class="cardHeader">
                <p id="heading"> TOTAL: $199</p>
                <p class="icon">💳</p>
            </div>
            <div class="cardNumber">
                <label id="creditCardLabel" for="creditCardNumber">CARD NUMBER</label>
                <input type="text" id="creditCardNumber" name="creditCardNumber" placeholder="1234 5678 9101 1020" required>
            </div>
            <div class="cardName">
                <label id="cardHolder"  for="fullName">CARD HOLDER</label>
                <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
            </div>
            <div id="cardExpiration">
                <label id="expirationLabel">EXPIRATION</label>
                <section class="date">
                    <input type='text' id="month" name="expMonth" placeholder="MM" aria-labelledby="expirationLabel" required>
                    <input type='text' id="year" name="expYear" placeholder="YY" aria-labelledby="expirationLabel" required>
                </section>
            </div>
        </section>
        <section class="cardBack">
            <div class="blackStrip"></div>
            <div id="cvc-cvv">
                <label for="cvc">CVC/CVV</label>
                <input type="text" id="cvc" name="cvc" placeholder="xxx" required>
            </div>    
        </section>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
