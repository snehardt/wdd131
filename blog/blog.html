<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog about Books</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <link href="blog.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Kids Read for Fun</h1>
        <nav aria-label="Main Menu">
            <ul class="main-nav">
                <li><a href="#">Home</a></li>
                <li><a href="#">Archive</a></li>
                <li><a href="#">Search</a></li>
            </ul>
        </nav>
    </header>
    <main id="main-content" role="main">
        <section id="book-list" aria-label="Books">
            <article class="book">
                <div class="book-info">
                    <p aria-label="Release Date">July 5, 2022</p>
                    <p aria-label="Recommended Age">10-14</p>
                    <p aria-label="Genre">Fantasy</p>
                    <p><span aria-label="4 out of 5 stars" role="img">⭐⭐⭐⭐</span></p>
                </div>
                <div class="book-content">
                    <h2>Septimus Heap Book One: Magyk</h2>
                    <img src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg" alt="Book cover for Septimus Heap Book One: Magyk">
                    <p>If you enjoy stories about seventh sons of seventh sons and magyk, then this is the book for you.</p>
                </div>
            </article>
        </section>
    </main>
<footer>
    <p>Jane Doe</p>
</footer>
</body>
</html>
